<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="container">


<header>

    <div class="header-icon">
        ✏️
    </div>

    <h1>
        Edit Student
    </h1>

    <p>
        Update student performance
    </p>

</header>


<section class="card">


<div class="section-title">

    <span>👨‍🎓</span>

    <h2>
        Student Information
    </h2>

</div>


<form method="POST">


<label>
    Student Name
</label>


<input
    type="text"
    name="name"
    value="{{ student['name'] }}"
    required
>


<h3 class="sub-heading">
    Subjects & Marks
</h3>


<div id="subjects-container">


{% for subject in subjects %}


<div class="subject-input-row">


<input
    type="text"
    name="subject"
    value="{{ subject['subject'] }}"
    placeholder="Subject"
    required
>


<input
    type="number"
    name="marks"
    value="{{ subject['marks'] }}"
    placeholder="Marks"
    min="0"
    max="100"
    required
>


<button
    type="button"
    class="remove-subject"
    onclick="removeSubject(this)"
>
    ✕
</button>


</div>


{% endfor %}


</div>


<button
    type="button"
    class="add-subject-btn"
    onclick="addSubject()"
>

    + Add Subject

</button>


<button
    type="submit"
    class="primary-btn"
>

    💾 Save Changes

</button>


</form>


<br>


<a href="/">
    ← Back to Dashboard
</a>


</section>


</div>


<script>


function addSubject() {

    const container =
        document.getElementById(
            "subjects-container"
        );


    const row =
        document.createElement("div");


    row.className =
        "subject-input-row";


    row.innerHTML = `

        <input
            type="text"
            name="subject"
            placeholder="Subject"
            required
        >

        <input
            type="number"
            name="marks"
            placeholder="Marks"
            min="0"
            max="100"
            required
        >

        <button
            type="button"
            class="remove-subject"
            onclick="removeSubject(this)"
        >
            ✕
        </button>

    `;


    container.appendChild(row);

}


function removeSubject(button) {

    const container =
        document.getElementById(
            "subjects-container"
        );


    const rows =
        container.querySelectorAll(
            ".subject-input-row"
        );


    if (rows.length > 1) {

        button.parentElement.remove();

    }

}


</script>


</body>

</html>
